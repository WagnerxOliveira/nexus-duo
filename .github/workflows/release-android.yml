name: Release Android (APK & GitHub Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom Release Notes / Changelog highlight (optional)'
        required: false
        default: 'Automated release build of NEXUS DUO'

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: 🤖 Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Setup Node.js 22 (for Checksum Utility)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure Android Signing Keystore (from Secrets)
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice::Injecting signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not configured. Building with default debug signing config."
          fi

      - name: Build Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: apps/mobile
        run: |
          flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release

      - name: Rename and Organize Output APKs
        run: |
          mkdir -p dist/apks
          find apps/mobile/build/app/outputs/flutter-apk -type f -name "*.apk" -exec cp {} dist/apks/ \;
          ls -lh dist/apks/

      - name: Generate SHA256SUMS.txt for Artifacts
        run: |
          node scripts/generate-sha256.mjs --dir dist/apks --write
          cat dist/apks/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/apks/*.apk
            dist/apks/SHA256SUMS.txt
          generate_release_notes: true
          name: NEXUS DUO Release ${{ github.ref_name }}
          body: |
            ${{ github.event.inputs.release_notes || '🎮 NEXUS DUO — Match Gamer & Segundo Monitor Web' }}

            ### 🔐 Verificação de Integridade (SHA-256)
            Todos os binários APK desta release têm seus hashes registrados em `SHA256SUMS.txt`.
            Para validar no terminal:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
