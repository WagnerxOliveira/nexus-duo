name: Release Android (APK & GitHub Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom Release Notes / Changelog highlight (optional)'
        required: false
        default: 'Automated release build of NEXUS DUO'

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: 🤖 Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Setup Node.js 22 (for Checksum Utility)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure Android Signing Keystore (from Secrets)
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice::Injecting signing keystore from GitHub Secrets..."
            CLEAN_STORE_PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
            CLEAN_KEY_PW="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
            CLEAN_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$CLEAN_STORE_PW
          keyPassword=$CLEAN_KEY_PW
          keyAlias=$CLEAN_ALIAS
          storeFile=upload-keystore.jks
          EOF
            cat <<'JAVA' > /tmp/VerifyKeystore.java
          import java.io.File;
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.util.Properties;

          public class VerifyKeystore {
            public static void main(String[] args) throws Exception {
              Properties props = new Properties();
              try (FileInputStream fis = new FileInputStream(args[1])) {
                props.load(fis);
              }
              KeyStore ks = KeyStore.getInstance(
                new File(args[0]),
                props.getProperty("storePassword").toCharArray()
              );
              Key key = ks.getKey(
                props.getProperty("keyAlias"),
                props.getProperty("keyPassword").toCharArray()
              );
              if (key == null) {
                throw new IllegalStateException("Key entry not found for alias");
              }
              System.out.println("CI Keystore verified OK: " + ks.getType() + " / " + key.getAlgorithm());
            }
          }
          JAVA
            java /tmp/VerifyKeystore.java android/app/upload-keystore.jks android/key.properties
            rm -f /tmp/VerifyKeystore.java
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not configured. Building with default debug signing config."
          fi

      - name: Build Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=(
            "--dart-define=APP_ENV=production"
            "--dart-define=GITHUB_RELEASES_REPO=${{ github.repository }}"
          )
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DART_DEFINES+=(
              "--dart-define=SUPABASE_URL=$SUPABASE_URL"
              "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            )
          else
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret is empty; building APK in Demo fallback mode."
          fi
          flutter build apk --release --split-per-abi "${DART_DEFINES[@]}"

      - name: Build Universal Release APK
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=(
            "--dart-define=APP_ENV=production"
            "--dart-define=GITHUB_RELEASES_REPO=${{ github.repository }}"
          )
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DART_DEFINES+=(
              "--dart-define=SUPABASE_URL=$SUPABASE_URL"
              "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            )
          fi
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Rename and Organize Output APKs
        run: |
          mkdir -p dist/apks
          APK_DIR="apps/mobile/build/app/outputs/flutter-apk"
          TAG="${{ github.ref_name }}"
          [ -f "$APK_DIR/app-release.apk" ] && cp "$APK_DIR/app-release.apk" "dist/apks/nexus-duo-${TAG}-universal.apk"
          [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && cp "$APK_DIR/app-arm64-v8a-release.apk" "dist/apks/nexus-duo-${TAG}-arm64-v8a.apk"
          [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && cp "$APK_DIR/app-armeabi-v7a-release.apk" "dist/apks/nexus-duo-${TAG}-armeabi-v7a.apk"
          [ -f "$APK_DIR/app-x86_64-release.apk" ] && cp "$APK_DIR/app-x86_64-release.apk" "dist/apks/nexus-duo-${TAG}-x86_64.apk"
          ls -lh dist/apks/
          test -f "dist/apks/nexus-duo-${TAG}-universal.apk"

      - name: Generate SHA256SUMS.txt for Artifacts
        run: |
          node scripts/generate-sha256.mjs --dir dist/apks --write
          cat dist/apks/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/apks/*.apk
            dist/apks/SHA256SUMS.txt
          generate_release_notes: true
          name: NEXUS DUO Release ${{ github.ref_name }}
          body: |
            ${{ github.event.inputs.release_notes || '🎮 NEXUS DUO — Match Gamer & Segundo Monitor Web' }}

            ### 🔐 Verificação de Integridade (SHA-256)
            Todos os binários APK desta release têm seus hashes registrados em `SHA256SUMS.txt`.
            Para validar no terminal:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
