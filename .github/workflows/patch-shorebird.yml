name: Patch Shorebird OTA (Mobile Instant Update)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track / channel'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      allow_native_diffs:
        description: 'Force patch even if native changes suspected (use with caution)'
        required: false
        default: false
        type: boolean

jobs:
  patch-android:
    name: 🦅 Shorebird Android OTA Patch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird CodePush CLI
        uses: shorebirdtech/actions/setup-shorebird@v1

      - name: Install Mobile Dependencies
        run: shorebird flutter pub get

      - name: Execute Shorebird OTA Patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.allow_native_diffs }}" = "true" ]; then
            EXTRA_ARGS="--allow-native-diffs"
          fi
          shorebird patch android --force --track ${{ github.event.inputs.track }} $EXTRA_ARGS
