name: nexus_duo
description: "NEXUS DUO — App de relacionamento gamer com arquitetura Clean, E2EE e Design System Cyber-Velvet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nexus_design_tokens:
    path: ../../packages/design-tokens
  cryptography: ^2.7.0
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
